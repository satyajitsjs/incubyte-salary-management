services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: salary_management
      POSTGRES_USER: salary_user
      POSTGRES_PASSWORD: salary_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary_user -d salary_management"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: docker-dev-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://salary_user:salary_password@db:5432/salary_management
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
